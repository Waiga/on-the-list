name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --no-deps .
      - run: cd "$RUNNER_TEMP" && on-the-list --help
      # The examples are part of the documented behaviour, so they are run.
      # Exit 1 means findings were reported, which is what the first one is for.
      - run: on-the-list examples/shade-stick.txt || test $? -eq 1
      - run: on-the-list --ingredients examples/plain-cream-inci.txt --pack-text examples/plain-cream-pack.txt
      - run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -v
